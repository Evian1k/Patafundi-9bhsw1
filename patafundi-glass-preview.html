<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PataFundi — Glass Edition | Interactive Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #F97316;
    --primary-dark: #C2410C;
    --accent: #1E9E8A;
    --accent-dark: #0E6B5C;
    --bg: #FBFAF8;
    --card: rgba(255, 255, 255, 0.65);
    --text: #1C1917;
    --text-2: #6B6560;
    --border: rgba(255, 255, 255, 0.3);
    --success: #27A35F;
    --warning: #FBBF24;
    --error: #EF4444;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 24px;
    --r-pill: 999px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(at 20% 20%, rgba(249, 115, 22, 0.4) 0%, transparent 50%),
      radial-gradient(at 80% 80%, rgba(30, 158, 138, 0.4) 0%, transparent 50%),
      radial-gradient(at 50% 50%, rgba(251, 191, 36, 0.2) 0%, transparent 50%),
      radial-gradient(at 90% 10%, rgba(249, 115, 22, 0.25) 0%, transparent 40%),
      radial-gradient(at 10% 90%, rgba(30, 158, 138, 0.25) 0%, transparent 40%),
      linear-gradient(135deg, #FBFAF8 0%, #F5EFE6 100%);
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
    background-attachment: fixed;
  }

  h1, h2, h3, h4, h5 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  /* ===== Glass surfaces ===== */
  .glass {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
  }
  .glass-strong {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }
  .glass-primary {
    background: rgba(249, 115, 22, 0.18);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(249, 115, 22, 0.25);
  }
  .glass-teal {
    background: rgba(30, 158, 138, 0.18);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(30, 158, 138, 0.25);
  }
  .glass-dark {
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
  }
  .glass-warn {
    background: rgba(251, 191, 36, 0.18);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(251, 191, 36, 0.3);
  }
  .glass-success {
    background: rgba(39, 163, 95, 0.18);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(39, 163, 95, 0.3);
  }
  .glass-error {
    background: rgba(239, 68, 68, 0.15);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(239, 68, 68, 0.25);
  }

  /* ===== Page layout ===== */
  .page {
    min-height: 100vh;
    padding: 32px 24px 60px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .page-header .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: var(--r-pill);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary-dark);
    margin-bottom: 14px;
  }
  .page-header .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 8px var(--primary);
  }
  .page-header h1 {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.05;
    background: linear-gradient(135deg, #1C1917 0%, #C2410C 60%, #F97316 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .page-header p {
    color: var(--text-2);
    font-size: 15px;
    font-weight: 500;
  }

  .app-toggle {
    display: inline-flex;
    padding: 6px;
    border-radius: var(--r-pill);
    margin-top: 22px;
    gap: 4px;
  }
  .app-toggle button {
    border: none;
    background: transparent;
    padding: 11px 26px;
    border-radius: var(--r-pill);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .app-toggle button.active {
    background: linear-gradient(135deg, #F97316 0%, #C2410C 100%);
    color: #fff;
    box-shadow: 0 6px 18px rgba(249, 115, 22, 0.35);
  }
  .app-toggle button svg { width: 16px; height: 16px; }

  .page-main {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    max-width: 1200px;
    margin: 0 auto;
    align-items: start;
  }

  /* ===== Screen list (sidebar) ===== */
  .screen-list {
    border-radius: var(--r-xl);
    padding: 20px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    position: sticky;
    top: 24px;
  }
  .screen-list::-webkit-scrollbar { width: 6px; }
  .screen-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
  .screen-list h3 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-2);
    margin-bottom: 12px;
    padding: 0 6px;
  }
  .screen-list .group + .group { margin-top: 18px; }
  .screen-list button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px 12px;
    border-radius: var(--r-md);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    margin-bottom: 2px;
  }
  .screen-list button:hover { background: rgba(255,255,255,0.5); }
  .screen-list button.active {
    background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(249, 115, 22, 0.1));
    border: 1px solid rgba(249, 115, 22, 0.3);
    font-weight: 600;
  }
  .screen-list button .num {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: rgba(0,0,0,0.06);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-2);
    flex-shrink: 0;
  }
  .screen-list button.active .num {
    background: var(--primary);
    color: #fff;
  }

  /* ===== Phone frame ===== */
  .phone-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: linear-gradient(145deg, #2a2a2c 0%, #1a1a1c 50%, #0f0f10 100%);
    border-radius: 55px;
    padding: 9px;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.08),
      0 0 0 2px #3a3a3c,
      0 35px 70px rgba(0, 0, 0, 0.35),
      0 15px 35px rgba(0, 0, 0, 0.25),
      0 0 80px rgba(249, 115, 22, 0.08);
    position: relative;
    flex-shrink: 0;
  }
  .phone::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 52px;
    background: linear-gradient(145deg, #3a3a3c 0%, transparent 30%, transparent 70%, #1a1a1c 100%);
    z-index: 0;
  }

  .phone-bezel {
    width: 100%;
    height: 100%;
    border-radius: 47px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    z-index: 1;
  }

  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 35px;
    background: #000;
    border-radius: 20px;
    z-index: 200;
  }

  .status-bar {
    height: 54px;
    padding: 18px 32px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
    position: relative;
    z-index: 100;
    color: var(--text);
  }
  .status-bar.dark { color: #fff; }
  .status-bar .time {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .status-bar .icons {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .status-bar .icons svg { display: block; }

  .screen-content {
    height: calc(100% - 54px);
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    -webkit-overflow-scrolling: touch;
    background: transparent;
  }
  .screen-content::-webkit-scrollbar { display: none; }
  .screen-content { scrollbar-width: none; }

  .screen {
    min-height: 100%;
    padding-bottom: 0;
    animation: slideInRight 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    position: relative;
  }
  .screen.back { animation: slideInLeft 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
  .screen.tab { animation: fadeIn 0.25s ease-out; }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 3px;
    z-index: 200;
  }

  .screen-label {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .screen-label .name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .screen-label .hint {
    font-size: 12px;
    color: var(--text-2);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .screen-label .hint svg { width: 13px; height: 13px; opacity: 0.7; }

  /* ===== Screen building blocks ===== */
  .scr-pad { padding: 0 20px 100px; }
  .scr-pad-tight { padding: 0 20px 20px; }

  /* Nav bar */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 16px;
    gap: 12px;
  }
  .nav-bar .nav-btn {
    width: 38px; height: 38px;
    border-radius: var(--r-pill);
    border: none;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease;
    color: var(--text);
    flex-shrink: 0;
  }
  .nav-bar .nav-btn:active { transform: scale(0.92); }
  .nav-bar .nav-btn svg { width: 20px; height: 20px; }
  .nav-bar .nav-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 17px;
    font-weight: 700;
    flex: 1;
    text-align: center;
  }
  .nav-bar .nav-spacer { width: 38px; flex-shrink: 0; }

  /* Inputs */
  .g-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--r-md);
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    transition: all 0.2s ease;
    outline: none;
  }
  .g-input::placeholder { color: var(--text-2); opacity: 0.7; }
  .g-input:focus {
    background: rgba(255,255,255,0.85);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
  }
  .g-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 7px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 15px 20px;
    border-radius: var(--r-md);
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #F97316 0%, #C2410C 100%);
    color: #fff;
    box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35);
  }
  .btn-teal {
    background: linear-gradient(135deg, #1E9E8A 0%, #0E6B5C 100%);
    color: #fff;
    box-shadow: 0 8px 20px rgba(30, 158, 138, 0.35);
  }
  .btn-outline-teal {
    background: rgba(30, 158, 138, 0.1);
    color: var(--accent-dark);
    border: 1.5px solid var(--accent);
  }
  .btn-outline-red {
    background: rgba(239, 68, 68, 0.1);
    color: var(--error);
    border: 1.5px solid var(--error);
  }
  .btn-success {
    background: linear-gradient(135deg, #27A35F 0%, #1a7a45 100%);
    color: #fff;
    box-shadow: 0 8px 20px rgba(39, 163, 95, 0.35);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.6);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.5);
  }

  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  /* Chip */
  .chip {
    padding: 7px 14px;
    border-radius: var(--r-pill);
    font-size: 13px;
    font-weight: 600;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.5);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .chip.active {
    background: linear-gradient(135deg, #F97316 0%, #C2410C 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(249,115,22,0.3);
  }
  .chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0;
    margin: 0 -20px;
    padding: 2px 20px;
  }
  .chip-row::-webkit-scrollbar { display: none; }

  /* Cards */
  .card { border-radius: var(--r-lg); padding: 16px; }
  .card-tap { cursor: pointer; transition: transform 0.15s ease; }
  .card-tap:active { transform: scale(0.98); }

  .grad-text {
    background: linear-gradient(135deg, #F97316 0%, #C2410C 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .grad-text-teal {
    background: linear-gradient(135deg, #1E9E8A 0%, #0E6B5C 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Bottom tab bar */
  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 84px;
    padding: 10px 12px 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-top: 1px solid rgba(255, 255, 255, 0.5);
    z-index: 50;
  }
  .tab-bar .tab {
    flex: 1;
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    cursor: pointer;
    color: var(--text-2);
    font-family: inherit;
    font-size: 10px;
    font-weight: 600;
    transition: color 0.2s ease;
  }
  .tab-bar .tab svg { width: 24px; height: 24px; }
  .tab-bar .tab.active { color: var(--primary); }
  .tab-bar .tab.active svg { filter: drop-shadow(0 2px 6px rgba(249,115,22,0.4)); }

  /* Service grid */
  .svc-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .svc-card {
    border-radius: var(--r-md);
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .svc-card:active { transform: scale(0.95); }
  .svc-card .emoji { font-size: 26px; display: block; margin-bottom: 6px; }
  .svc-card .lbl { font-size: 11px; font-weight: 600; color: var(--text); }

  /* Avatar */
  .avatar {
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .avatar-grad-orange {
    background: linear-gradient(135deg, #F97316 0%, #C2410C 100%);
  }
  .avatar-grad-teal {
    background: linear-gradient(135deg, #1E9E8A 0%, #0E6B5C 100%);
  }

  /* OTP boxes */
  .otp-row {
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }
  .otp-box {
    flex: 1;
    aspect-ratio: 1;
    max-width: 44px;
    border-radius: var(--r-md);
    border: 1.5px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    text-align: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    outline: none;
  }
  .otp-box.filled {
    background: rgba(249,115,22,0.12);
    border-color: var(--primary);
  }

  /* Stars */
  .stars { display: inline-flex; gap: 6px; }
  .stars svg { width: 32px; height: 32px; cursor: pointer; }

  /* Map area */
  .map {
    height: 200px;
    border-radius: var(--r-lg);
    background:
      radial-gradient(at 30% 40%, rgba(30,158,138,0.5) 0%, transparent 40%),
      radial-gradient(at 70% 60%, rgba(249,115,22,0.4) 0%, transparent 40%),
      linear-gradient(135deg, #d4e8e4 0%, #e8d4c4 100%);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .map::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.25) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .map::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(120deg, transparent 40%, rgba(30,158,138,0.35) 50%, transparent 60%);
  }
  .map-pin {
    position: absolute;
    z-index: 5;
    width: 28px; height: 28px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .map-pin.orange { background: linear-gradient(135deg, #F97316, #C2410C); }
  .map-pin.teal { background: linear-gradient(135deg, #1E9E8A, #0E6B5C); }
  .map-pin .dot {
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 50%;
    transform: rotate(45deg);
  }
  .map-route {
    position: absolute;
    z-index: 2;
    height: 3px;
    background: linear-gradient(90deg, #F97316, #1E9E8A);
    transform-origin: left center;
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
  }

  /* Timeline */
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 11px; top: 8px; bottom: 8px;
    width: 2px;

  .tl-item {

  .tl-dot {
    position: absolute;
    left: -23px; top: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(0,0,0,0.1);
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.08);

  .tl-item.active .tl-dot {

  .tl-item.done .tl-dot { background: var(--success); }
  .tl-item .tl-title { font-size: 13px; font-weight: 600; }
  .tl-item .tl-time { font-size: 11px; color: var(--text-2); margin-top: 2px; }

    font-size: 14px;

  .toggle::after {

/* ---------- Tab bar ---------- */
function tabBar(active, isFundi) {
  const tabs = isFundi
    ? [
        { id: 'dashboard', label: 'Dashboard', icon: I.home },
        { id: 'fundiJobs', label: 'Jobs', icon: I.briefcase },
        { id: 'fundiWallet', label: 'Wallet', icon: I.wallet },
        { id: 'fundiProfile', label: 'Profile', icon: I.user },
      ]
    : [
        { id: 'home', label: 'Home', icon: I.home },
        { id: 'jobs', label: 'Jobs', icon: I.briefcase },
        { id: 'wallet', label: 'Wallet', icon: I.wallet },
        { id: 'profile', label: 'Profile', icon: I.user },
      ];
  return `<div class="tab-bar">
    ${tabs.map(t => `<button class="tab ${t.id === active ? 'active' : ''}" data-tab="${t.id}">${t.icon}<span>${t.label}</span></button>`).join('')}
  </div>`;
}

/* ---------- Nav bar ---------- */
function navBar(title, opts = {}) {
  const right = opts.right || '';
  return `<div class="nav-bar">
    <button class="nav-btn" data-back>${I.arrowLeft}</button>
    <div class="nav-title">${title}</div>
    <div class="nav-spacer">${right}</div>
  </div>`;
}

/* ============================================================
   STATE + NAVIGATION
   ============================================================ */

const allScreens = { customer: customerScreens, fundi: fundiScreens };

const screenMenu = {
  customer: [
    { group: 'Auth', items: ['login', 'register', 'otp'] },
    { group: 'Main', items: ['home', 'createJob', 'jobs', 'jobTracking', 'chat', 'review'] },
    { group: 'Account', items: ['wallet', 'profile', 'notifications', 'settings'] },
  ],
  fundi: [
    { group: 'Auth', items: ['fundiLogin'] },
    { group: 'Main', items: ['dashboard', 'fundiJobs', 'jobDetail', 'fundiWallet', 'fundiProfile'] },
  ],
};

const state = {
  app: 'customer',
  screen: 'login',
  history: [],
};

function navigate(target, opts = {}) {
  const dir = opts.direction || 'forward';
  if (target === state.screen) return;
  if (dir === 'forward') {
    state.history.push(state.screen);
  }
  state.screen = target;
  render(dir);
}

function back() {
  const prev = state.history.pop();
  if (prev) {
    state.screen = prev;
    render('back');
  }
}

function switchApp(app) {
  state.app = app;
  state.screen = app === 'customer' ? 'login' : 'fundiLogin';
  state.history = [];
  render('tab');
  renderScreenList();
}

function render(direction) {
  const screens = allScreens[state.app];
  const def = screens[state.screen];
  if (!def) return;

  const content = document.getElementById('screenContent');
  const animClass = direction === 'back' ? 'back' : direction === 'tab' ? 'tab' : '';
  content.innerHTML = `<div class="screen ${animClass}">${def.render()}</div>`;
  document.getElementById('screenName').textContent = def.title;
  content.scrollTop = 0;
  renderScreenList();

  // Update app toggle
  document.querySelectorAll('#appToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.app === state.app);
  });
}

function renderScreenList() {
  const list = document.getElementById('screenList');
  const menu = screenMenu[state.app];
  let html = '';
  menu.forEach((g, gi) => {
    html += `<div class="group"><h3>${g.group}</h3>`;
    g.items.forEach((s, i) => {
      const def = allScreens[state.app][s];
      const num = menu.slice(0, gi).reduce((acc, gg) => acc + gg.items.length, 0) + i + 1;
      const active = s === state.screen ? 'active' : '';
      html += `<button class="${active}" data-jump="${s}"><span class="num">${num}</span>${def.title}</button>`;
    });
    html += `</div>`;
  });
  list.innerHTML = html;
}

/* ---------- Event delegation ---------- */
document.addEventListener('click', (e) => {
  // App toggle
  const appBtn = e.target.closest('[data-app]');
  if (appBtn) {
    switchApp(appBtn.dataset.app);
    return;
  }
  // Jump from sidebar
  const jump = e.target.closest('[data-jump]');
  if (jump) {
    state.history = [];
    state.screen = jump.dataset.jump;
    render('tab');
    return;
  }
  // Back button
  if (e.target.closest('[data-back]')) {
    back();
    return;
  }
  // Tab bar nav (root-level, clears history)
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    state.history = [];
    state.screen = tab.dataset.tab;
    render('tab');
    return;
  }
  // Forward nav
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    navigate(nav.dataset.nav, { direction: 'forward' });
    return;
  }
});

/* ---------- OTP input behavior ---------- */
document.addEventListener('input', (e) => {
  if (e.target.classList.contains('otp-box')) {
    if (e.target.value) {
      e.target.classList.add('filled');
      const next = e.target.nextElementSibling;
      if (next && next.classList.contains('otp-box')) next.focus();
    } else {
      e.target.classList.remove('filled');
    }
  }
});

/* ---------- Init ---------- */
render('tab');
</script>
