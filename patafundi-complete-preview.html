<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PataFundi — Complete App Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #F97316; --primary-dark: #EA580C; --primary-light: #FED7AA;
  --accent: #1E9E8A; --accent-dark: #0E6B5C; --accent-light: #5EEAD4;
  --bg: #FBFAF8; --card: rgba(255,255,255,0.72); --card-solid: #FFFFFF;
  --text: #1C1917; --text-2: #78716C; --text-3: #A8A29E;
  --border: #E7E5E4; --border-light: rgba(255,255,255,0.4);
  --success: #27A35F; --warning: #F59E0B; --error: #EF4444; --info: #3B82F6;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px; --radius-2xl: 24px; --radius-pill: 999px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(at 20% 20%, rgba(249,115,22,0.10) 0%, transparent 50%),
    radial-gradient(at 80% 80%, rgba(30,158,138,0.10) 0%, transparent 50%),
    radial-gradient(at 50% 50%, rgba(251,191,36,0.05) 0%, transparent 50%),
    #FBFAF8;
  min-height: 100vh; color: var(--text); padding: 20px;
}
h1,h2,h3,h4 { font-family: 'Plus Jakarta Sans', sans-serif; }

/* Header */
.page-header { text-align:center; margin: 20px auto 32px; max-width: 800px; }
.page-header h1 { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #F97316, #1E9E8A); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
.page-header p { color: var(--text-2); font-size: 15px; }

/* App toggle */
.app-toggle { display:flex; gap:4px; background: rgba(255,255,255,0.5); backdrop-filter: blur(20px); padding: 4px; border-radius: var(--radius-pill); margin: 0 auto 32px; width: fit-content; border: 1px solid var(--border-light); }
.app-toggle button { padding: 10px 24px; border:none; background:transparent; font-family:inherit; font-size:14px; font-weight:600; color:var(--text-2); border-radius: var(--radius-pill); cursor:pointer; transition: all 0.3s; }
.app-toggle button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }

/* Layout */
.main-layout { display: flex; gap: 24px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
.phone-section { flex: 1; display: flex; flex-direction: column; align-items: center; }
.sidebar { width: 280px; background: rgba(255,255,255,0.5); backdrop-filter: blur(20px); border: 1px solid var(--border-light); border-radius: var(--radius-2xl); padding: 16px; max-height: 850px; overflow-y: auto; position: sticky; top: 20px; }
.sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); margin: 16px 0 8px; padding-left: 8px; }
.sidebar h3:first-child { margin-top: 0; }
.sidebar-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-md); cursor: pointer; font-size: 13px; color: var(--text); transition: all 0.2s; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; }
.sidebar-item:hover { background: rgba(249,115,22,0.08); }
.sidebar-item.active { background: linear-gradient(135deg, rgba(249,115,22,0.15), rgba(234,88,12,0.1)); color: var(--primary); font-weight: 600; }
.sidebar-search { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: inherit; font-size: 13px; margin-bottom: 12px; background: rgba(255,255,255,0.6); }

/* Phone frame */
.phone-frame { width: 390px; height: 844px; background: #1C1917; border-radius: 55px; padding: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 2px #3a3a3a; position: relative; }
.phone-screen { width: 100%; height: 100%; background: var(--bg); border-radius: 47px; overflow: hidden; position: relative; }
.dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 100; }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 18px 28px 0; font-size: 14px; font-weight: 600; z-index: 99; }
.status-bar svg { width: 18px; height: 18px; }
.status-right { display: flex; gap: 6px; align-items: center; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: #1C1917; border-radius: 3px; z-index: 100; opacity: 0.3; }

/* Screen content */
.screen { position: absolute; top: 54px; left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; }
.screen.hidden { display: none; }
.screen-content { padding: 16px 20px 100px; min-height: 100%; }
.screen-content.no-tab { padding-bottom: 40px; }

/* Glass card */
.glass-card { background: var(--card); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 20px; box-shadow: 0 4px 24px rgba(28,25,23,0.06); }
.glass-card-teal { background: rgba(30,158,138,0.10); backdrop-filter: blur(20px); border: 1px solid rgba(30,158,138,0.2); border-radius: var(--radius-xl); padding: 20px; }

/* Buttons */
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: var(--radius-lg); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(249,115,22,0.25); transition: transform 0.2s; }
.btn-primary:active { transform: scale(0.97); }
.btn-teal { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); box-shadow: 0 4px 12px rgba(30,158,138,0.25); }
.btn-secondary { background: rgba(30,158,138,0.08); color: var(--accent); border: 1px solid rgba(30,158,138,0.2); }
.btn-danger { background: rgba(239,68,68,0.08); color: var(--error); border: 1px solid rgba(239,68,68,0.2); }
.btn-ghost { background: transparent; color: var(--text-2); border: none; }

/* Inputs */
.input-wrap { display: flex; align-items: center; height: 48px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: white; padding: 0 16px; gap: 8px; margin-bottom: 12px; }
.input-wrap input { flex: 1; border: none; outline: none; font-family: inherit; font-size: 15px; background: transparent; }
.input-icon { width: 20px; height: 20px; color: var(--text-2); flex-shrink: 0; }

/* Bottom tab bar */
.tab-bar { position: absolute; bottom: 24px; left: 16px; right: 16px; height: 56px; background: rgba(255,255,255,0.75); backdrop-filter: blur(24px) saturate(180%); border-radius: var(--radius-2xl); display: flex; align-items: center; justify-content: space-around; box-shadow: 0 8px 32px rgba(28,25,23,0.12); border: 1px solid rgba(255,255,255,0.5); }
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; border: none; background: transparent; padding: 4px 12px; border-radius: var(--radius-md); transition: all 0.2s; }
.tab-item svg { width: 22px; height: 22px; color: var(--text-2); }
.tab-item.active svg { color: var(--primary); }
.tab-item span { font-size: 10px; color: var(--text-2); font-weight: 500; }
.tab-item.active span { color: var(--primary); font-weight: 600; }

/* Header bar */
.header-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 16px; }
.header-bar h2 { font-size: 22px; font-weight: 700; }
.back-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.6); border-radius: var(--radius-md); cursor: pointer; border: 1px solid var(--border-light); }
.back-btn svg { width: 20px; height: 20px; }

/* Screen label */
.screen-label { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-2); font-weight: 500; }
.screen-label strong { color: var(--primary); }

/* Pricing hero */
.price-hero { font-family: 'Plus Jakarta Sans'; font-size: 40px; font-weight: 800; color: var(--primary); text-align: center; margin: 8px 0; }

/* Service grid */
.service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.service-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; background: white; border: 1.5px solid var(--border); border-radius: var(--radius-lg); cursor: pointer; transition: all 0.2s; }
.service-chip.selected { border-color: var(--primary); background: rgba(249,115,22,0.08); }
.service-chip svg { width: 24px; height: 24px; }
.service-chip span { font-size: 11px; color: var(--text); text-align: center; }
.service-chip.selected span { color: var(--primary); font-weight: 600; }

/* Trust grid */
.trust-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.trust-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; background: rgba(255,255,255,0.72); backdrop-filter: blur(20px); border: 1px solid var(--border-light); border-radius: var(--radius-xl); cursor: pointer; transition: all 0.2s; text-align: center; }
.trust-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(28,25,23,0.1); }
.trust-card-icon { width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
.trust-card-icon svg { width: 22px; height: 22px; color: white; }
.trust-card span { font-size: 12px; font-weight: 600; color: var(--text); }

/* Timeline */
.timeline { display: flex; flex-direction: column; gap: 16px; }
.timeline-step { display: flex; gap: 12px; align-items: flex-start; }
.timeline-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.timeline-dot svg { width: 16px; height: 16px; color: white; }
.timeline-content { flex: 1; padding-top: 4px; }
.timeline-content h4 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.timeline-content p { font-size: 13px; color: var(--text-2); line-height: 1.5; }

/* Progress bar */
.progress-track { height: 4px; background: var(--border); border-radius: var(--radius-pill); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark)); border-radius: var(--radius-pill); transition: width 0.5s; }

/* Onboarding */
.onboarding-slide { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; text-align: center; }
.onboarding-icon { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
.onboarding-icon svg { width: 32px; height: 32px; color: white; }
.onboarding-slide h2 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
.onboarding-slide p { font-size: 16px; color: var(--text-2); line-height: 1.5; max-width: 280px; }
.onboarding-dots { display: flex; gap: 8px; margin: 32px 0; }
.onboarding-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--border); transition: all 0.3s; }
.onboarding-dot.active { width: 24px; background: var(--primary); }

/* Chat */
.chat-msg { max-width: 75%; padding: 10px 14px; border-radius: var(--radius-xl); font-size: 14px; line-height: 1.4; margin-bottom: 8px; }
.chat-msg.them { align-self: flex-start; background: rgba(255,255,255,0.72); border: 1px solid var(--border-light); border-bottom-left-radius: 4px; }
.chat-msg.me { align-self: flex-end; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border-bottom-right-radius: 4px; }

/* Status badge */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; }

/* SVG icons */
.icon-svg { display: inline-block; vertical-align: middle; }

/* Feature highlights */
.feature-highlight { background: linear-gradient(135deg, rgba(249,115,22,0.08), rgba(30,158,138,0.08)); border: 1px solid var(--border-light); border-radius: var(--radius-2xl); padding: 16px; margin: 16px 0; }
.feature-highlight h4 { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.feature-highlight p { font-size: 13px; color: var(--text-2); }

/* Info section */
.info-section { margin-bottom: 16px; }
.info-section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.info-section-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.info-section-icon svg { width: 20px; height: 20px; color: white; }
.info-section h4 { font-size: 15px; font-weight: 700; }
.info-section p { font-size: 13px; color: var(--text-2); line-height: 1.5; }

/* Flow diagram */
.flow-diagram { display: flex; flex-direction: column; gap: 8px; }
.flow-step { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.6); border-radius: var(--radius-lg); border: 1px solid var(--border-light); }
.flow-step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.flow-step-content h5 { font-size: 13px; font-weight: 600; }
.flow-step-content p { font-size: 11px; color: var(--text-2); }
.flow-arrow { text-align: center; color: var(--text-3); font-size: 18px; }

/* Hide scrollbar */
.screen::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 0; }
</style>
</head>

  <p>64 screens · Customer + Fundi · Glass morphism · Apple/Uber quality</p>
</div>

<div class="app-toggle">
  <button class="active" onclick="switchApp('customer')">📱 Customer App</button>

</div>

<div class="main-layout">

</div>

// Tab bar
function tabBar(active) {
  const tabs = currentApp === 'customer'
    ? [['home','Home','home'],['jobs','Jobs','briefcase'],['wallet','Wallet','wallet'],['profile','Profile','person']]
    : [['f-dashboard','Dashboard','home'],['f-jobs','Jobs','briefcase'],['f-wallet','Wallet','wallet'],['f-profile','Profile','person']];
  return `<div class="tab-bar">
    ${tabs.map(([id,label,icon]) => `<div class="tab-item ${active===id?'active':''}" onclick="nav('${id}')">${ICONS[icon]}<span>${label}</span></div>`).join('')}
  </div>`;
}

// Navigation
function nav(screenId) {
  currentScreen = screenId;
  renderScreen();
  updateSidebar();
}

function renderScreen() {
  const container = document.getElementById('screen-container');
  const renderer = renderers[currentScreen];
  if (renderer) {
    container.innerHTML = renderer();
  } else {
    container.innerHTML = `<div style="padding:40px; text-align:center;"><h2>Screen: ${currentScreen}</h2><p>This screen exists in the mobile app.</p></div>`;
  }
  const labelEl = document.getElementById('screen-label');
  const allScreens = [...screens.customer, ...screens.fundi];
  const found = allScreens.find(s => s.id === currentScreen);
  const appName = currentApp === 'customer' ? 'Customer' : 'Fundi';
  labelEl.innerHTML = `${appName} — <strong>${found ? found.name : currentScreen}</strong>`;
  container.scrollTop = 0;
}

function switchApp(app) {
  currentApp = app;
  document.querySelectorAll('.app-toggle button').forEach((btn, i) => {
    btn.classList.toggle('active', (app === 'customer' && i === 0) || (app === 'fundi' && i === 1));
  });
  currentScreen = app === 'customer' ? 'onboarding' : 'f-login';
  renderSidebar();
  renderScreen();
}

function renderSidebar() {
  const container = document.getElementById('sidebar-content');
  const appScreens = screens[currentApp];
  let html = '';
  let currentCat = '';
  for (const s of appScreens) {
    if (s.cat !== currentCat) {
      html += `<h3>${s.cat}</h3>`;
      currentCat = s.cat;
    }
    html += `<button class="sidebar-item ${s.id === currentScreen ? 'active' : ''}" onclick="nav('${s.id}')">${s.highlight ? '★ ' : ''}${s.name}</button>`;
  }
  container.innerHTML = html;
}

function updateSidebar() {
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.classList.toggle('active', item.getAttribute('onclick').includes(`'${currentScreen}'`));
  });
}

function filterScreens(query) {
  const items = document.querySelectorAll('.sidebar-item');
  const headers = document.querySelectorAll('.sidebar h3');
  items.forEach(item => {
    const text = item.textContent.toLowerCase();
    const match = text.includes(query.toLowerCase());
    item.style.display = match ? '' : 'none';
  });
  headers.forEach(h => {
    let hasVisible = false;
    let next = h.nextElementSibling;
    while (next && next.tagName === 'BUTTON') {
      if (next.style.display !== 'none') { hasVisible = true; break; }
      next = next.nextElementSibling;
    }
    h.style.display = hasVisible ? '' : 'none';
  });
}

// Init
renderSidebar();
renderScreen();

// Add spin animation
const style = document.createElement('style');
style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
document.head.appendChild(style);
</script>
