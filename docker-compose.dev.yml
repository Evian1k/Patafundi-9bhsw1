version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: patafundi-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patafundi_dev
    ports:
      - '5432:5432'
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patafundi_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - patafundi_net

networks:
  patafundi_net:
    driver: bridge
