apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patafundi-local
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: api-config.yaml
images:
  - name: patafundi/backend
    newName: patafundi/backend
    newTag: local
  - name: patafundi/frontend
    newName: patafundi/frontend
    newTag: local
