apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patafundi-production
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: api-config.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: patafundi
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.patafundi.example.invalid
      - op: replace
        path: /spec/rules/0/host
        value: www.patafundi.example.invalid
images:
  - name: patafundi/backend
    newName: registry.example.invalid/patafundi/backend
    newTag: replace-before-deploy
  - name: patafundi/frontend
    newName: registry.example.invalid/patafundi/frontend
    newTag: replace-before-deploy
