apiVersion: apps/v1
kind: Deployment
metadata:
  name: patafundi-api
  labels:
    app.kubernetes.io/name: patafundi-api
    app.kubernetes.io/part-of: patafundi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patafundi-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patafundi-api
        app.kubernetes.io/part-of: patafundi
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: patafundi/backend:local
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/src/server.js"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: patafundi-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: patafundi-runtime
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: patafundi-runtime
                  key: JWT_SECRET
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: patafundi-runtime
                  key: REFRESH_TOKEN_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: patafundi-runtime
                  key: ENCRYPTION_KEY
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/backend/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: patafundi-uploads
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: patafundi-api
    app.kubernetes.io/part-of: patafundi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: patafundi-api
  ports:
    - name: http
      port: 4000
      targetPort: http
