apiVersion: apps/v1
kind: Deployment
metadata:
  name: patafundi-web
  labels:
    app.kubernetes.io/name: patafundi-web
    app.kubernetes.io/part-of: patafundi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patafundi-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patafundi-web
        app.kubernetes.io/part-of: patafundi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: patafundi/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: patafundi-web
  labels:
    app.kubernetes.io/name: patafundi-web
    app.kubernetes.io/part-of: patafundi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: patafundi-web
  ports:
    - name: http
      port: 8080
      targetPort: http
