apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patafundi
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - patafundi.example.invalid
      secretName: patafundi-tls
  rules:
    - host: patafundi.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: patafundi-web
                port:
                  number: 8080
