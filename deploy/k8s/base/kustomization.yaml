apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api.yaml
  - web.yaml
  - ingress.yaml
  - ingress-policy.yaml
  - uploads-pvc.yaml
configMapGenerator:
  - name: patafundi-api-config
    literals:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - PATAFUNDI_MANAGED_MIGRATIONS=true
      - PATAFUNDI_ENABLE_DEMO_SEED=false
      - COOKIE_SECURE=true
      - FRONTEND_ORIGIN=https://patafundi.example.invalid
      - CORS_ORIGINS=https://patafundi.example.invalid
generatorOptions:
  disableNameSuffixHash: true
