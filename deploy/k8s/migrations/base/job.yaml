apiVersion: batch/v1
kind: Job
metadata:
  name: patafundi-migrate
  labels:
    app.kubernetes.io/name: patafundi-migrate
    app.kubernetes.io/part-of: patafundi
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patafundi-migrate
        app.kubernetes.io/part-of: patafundi
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: patafundi/backend:local
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/scripts/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: patafundi-runtime
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
