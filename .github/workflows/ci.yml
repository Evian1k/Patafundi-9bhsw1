name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Isolated embedded-database suite. PostgreSQL coverage runs separately.
      - run: npm test
        env:
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-32-chars
          PATAFUNDI_EMBEDDED_DB: '1'

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: patafundi_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d patafundi_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Apply migrations and run complete PostgreSQL suite
        run: |
          npm run db:migrate
          npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:ci-disposable-password@127.0.0.1:5432/patafundi_test_ci
          PATAFUNDI_TEST_DATABASE_URL: postgres://postgres:ci-disposable-password@127.0.0.1:5432/patafundi_test_ci
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-32-chars

  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-32-chars
          PATAFUNDI_EMBEDDED_DB: '1'

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Audit customer mobile dependencies
        run: npm audit --prefix apps/customer-mobile --audit-level=high
      - name: Audit Fundi mobile dependencies
        run: npm audit --prefix apps/fundi-mobile --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Prove the Docker-first story stays reproducible (spec §29)
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false

  mobile-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer-mobile, fundi-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run typecheck
        working-directory: apps/${{ matrix.app }}
      - run: npx expo install --check
        working-directory: apps/${{ matrix.app }}
      - run: npx expo export --platform android
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_PUBLIC_API_URL: https://ci-api.invalid
      - run: npx expo export --platform ios
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_PUBLIC_API_URL: https://ci-api.invalid

  kustomize-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render local, staging, and production configurations
        run: |
          kubectl kustomize deploy/k8s/overlays/local > /dev/null
          kubectl kustomize deploy/k8s/overlays/staging > /dev/null
          kubectl kustomize deploy/k8s/overlays/production > /dev/null
          kubectl kustomize deploy/k8s/migrations/overlays/local > /dev/null
          kubectl kustomize deploy/k8s/migrations/overlays/staging > /dev/null
          kubectl kustomize deploy/k8s/migrations/overlays/production > /dev/null
