# Local development stack. It never seeds demo accounts automatically.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patafundi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-patafundi_dev}
    volumes:
      - patafundi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patafundi} -d ${POSTGRES_DB:-patafundi_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "backend/scripts/migrate.js"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-patafundi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-patafundi_dev}

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 4000
      PATAFUNDI_MANAGED_MIGRATIONS: "true"
      PATAFUNDI_ENABLE_DEMO_SEED: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-patafundi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-patafundi_dev}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/compose/.env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in deploy/compose/.env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in deploy/compose/.env}
      FRONTEND_ORIGIN: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"
    volumes:
      - patafundi_uploads:/app/backend/uploads
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    init: true
    stop_grace_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    init: true

volumes:
  patafundi_pgdata:
  patafundi_uploads:
